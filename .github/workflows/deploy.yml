name: Deploy to Amazon EC2

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  CONTAINER_NAME: nordhealth_app
  SSH_PORT: '22'
  EC2_USER: ec2-user
  EC2_HOST: ${{ secrets.EC2_HOST }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: demo

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR (get registry)
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        set -e
        echo "Building image $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          REPO=${{ env.ECR_REPOSITORY }}
          TAG=${{ github.sha }}
          CONTAINER=${{ env.CONTAINER_NAME }}

          echo "Logging in to ECR $ECR_REGISTRY"
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          echo "Pulling image: $ECR_REGISTRY/$REPO:$TAG"
          docker pull "$ECR_REGISTRY/$REPO:$TAG"

          echo "Stopping any existing container named $CONTAINER"
          docker stop "$CONTAINER" || true
          docker rm "$CONTAINER" || true

          echo "Starting container $CONTAINER"
          docker run -d --name "$CONTAINER" -p 5000:5000 --restart unless-stopped "$ECR_REGISTRY/$REPO:$TAG"

          echo "Deployment finished"

